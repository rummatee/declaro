[workspace]
members = ["focusable-macro"]

[package]
name = "declaro"
version = "0.1.0"
authors = ["Florian Schunk <florian.git@repatr.de>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
closure = "0.3.0"
dioxus = { version = "0.7.3", features = ["router"] }
syntax = { git = "https://github.com/rummatee/nil" }
nix-interop = { git = "https://github.com/rummatee/nil" }
ide = { git = "https://github.com/rummatee/nil" }
rowan = "0.16.1"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-free-icons = { version = "0.10", features = ["font-awesome-solid"] }
rfd = "0.17.2"
dioxus-motion = { version = "0.3.0", optional = true, default-features = false }
cfg-if = "1.0.4"
mockall_double = "0.3.1"
thiserror = "2.0.18"
focusable-macro = { path = "focusable-macro" }

[features]
default = ["desktop"]
web = ["dioxus/web", "dioxus-motion/web", "dioxus-motion/transitions"]
desktop = [
    "dioxus/desktop",
    "dioxus-motion/desktop",
    "dioxus-motion/transitions",
]
mobile = ["dioxus/mobile", "dioxus-motion/desktop", "dioxus-motion/transitions"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[dev-dependencies]
dioxus-ssr = "0.7.3"
insta = "1.46.3"
mockall = "0.14"
serial_test = "3.4.0"
